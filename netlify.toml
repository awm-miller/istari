[build]
  functions = "netlify/functions"

[[redirects]]
  from = "/"
  to = "/mb/"
  status = 302

[[redirects]]
  from = "/mb"
  to = "/mb/"
  status = 301

[[redirects]]
  from = "/94-park-ave"
  to = "/94-park-ave/"
  status = 301

[[redirects]]
  from = "/iran"
  to = "/iran/"
  status = 301

[[redirects]]
  from = "/iums"
  to = "/iums/"
  status = 301

[[redirects]]
  from = "/sevenspikes"
  to = "/sevenspikes/"
  status = 301

[[redirects]]
  from = "/expanded-mb-names"
  to = "/expanded-mb-names/"
  status = 301

[[redirects]]
  from = "/api/investigations/:job/events"
  to = "/.netlify/functions/istari-events-proxy?job=:job"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/istari-backend-proxy?target=/api/:splat"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/istari-backend-proxy?target=/health"
  status = 200

[[redirects]]
  from = "/generated-graphs/*"
  to = "/.netlify/functions/istari-backend-proxy?target=/generated-graphs/:splat"
  status = 200

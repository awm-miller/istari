[project]
name = "project-istari"
version = "0.1.0"
description = "CLI pipeline for linking people to England and Wales charities."
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "gunicorn>=23.0",
    "networkx>=3.0",
    "opendataloader-pdf>=2.0.2",
    "PyMuPDF>=1.24",
    "pytesseract>=0.3",
    "Pillow>=10.0",
    "PyYAML>=6.0",
]

[project.scripts]
istari = "src.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "node_modules", "netlify_graph_viewer", "output", "server_backups"]
